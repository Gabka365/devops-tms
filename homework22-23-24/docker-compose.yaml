volumes: 
  datafiles:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

services:
  mysqlDb:
    image: mysql:latest
    container_name: mysqlDb
    volumes:
        - datafiles:/var/lib/mysql
    environment:
        MYSQL_ROOT_PASSWORD: root
    restart: always
    logging: *default-logging
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s 
      timeout: 3s         
      retries: 3          
      start_period: 10s

  cars_api:
    container_name: cars-api
    build: 
      dockerfile: ./Api/Api/Dockerfile
    env_file:
      - .env
    restart: always
    environment:
      - DbOptions__ConnectionString=${CONNECTION_STRING}
      - DbOptions__DatabaseName=${DB_NAME}
    volumes:
      - ./logs-dotnet:/app/logs-dotnet
    logging: *default-logging
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s       
      timeout: 3s         
      retries: 3          
      start_period: 5s
    depends_on:
      mysqlDb:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart:
      always
    logging: *default-logging
    networks:
      - frontend
    depends_on:
      cars_api:
        condition: service_healthy